# Untuk Docker Compose dari terminal proyek. Web editor Portainer menggunakan docker-compose.portainer.yml.
name: jadwal

x-app: &app
  image: jadwal-app:local
  build: .

x-db-connection: &db-connection
  DB_HOST: db
  DB_DATABASE: db_penjadwalan_ruang
  DB_USERNAME: jadwal
  DB_PASSWORD: ${JADWAL_DB_PASSWORD:?Isi JADWAL_DB_PASSWORD di .env}

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: db_penjadwalan_ruang
      MARIADB_USER: jadwal
      MARIADB_PASSWORD: ${JADWAL_DB_PASSWORD:?Isi JADWAL_DB_PASSWORD di .env}
      MARIADB_ROOT_PASSWORD: ${JADWAL_DB_ROOT_PASSWORD:?Isi JADWAL_DB_ROOT_PASSWORD di .env}
    volumes:
      - database:/var/lib/mysql
      - ./database/db_penjadwalan_ruang.sql:/docker-entrypoint-initdb.d/10-jadwal.sql:ro
      - ./docker/remove-demo-accounts.sql:/docker-entrypoint-initdb.d/20-remove-demo-accounts.sql:ro
      - ./database/academic_periods.sql:/docker-entrypoint-initdb.d/30-academic-periods.sql:ro
    networks: [database]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  setup:
    <<: *app
    command: ["php", "docker/bootstrap-admin.php"]
    environment:
      <<: *db-connection
      JADWAL_ADMIN_EMAIL: ${JADWAL_ADMIN_EMAIL:-}
      JADWAL_ADMIN_PASSWORD: ${JADWAL_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [database]

  web:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *db-connection
      APP_COOKIE_SECURE: ${JADWAL_COOKIE_SECURE:-0}
    ports:
      - "127.0.0.1:${JADWAL_HTTP_PORT:-8093}:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      setup:
        condition: service_completed_successfully
    networks: [database, tunnel]

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    networks: [tunnel]

networks:
  database:
    internal: true
  tunnel:

volumes:
  database:
